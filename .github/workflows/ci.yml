# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.19', '1.22', '1.23']
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: Generate
        run: make generate

      - name: Verify no drift
        run: git diff --exit-code go/pkg/lockfile/schema_gen.go

      - name: Lint
        run: make lint

      - name: Test
        run: make test
